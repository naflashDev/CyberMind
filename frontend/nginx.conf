server {
    listen 80;
    server_name localhost;

    # Aumentar límite de tamaño para subida de archivos (documentos RAG, hashes, código)
    client_max_body_size 100M;

    # Compresión gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Raíz de la SPA
    root /usr/share/nginx/html;
    index index.html;

    # Enrutamiento SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso transparente a la API Backend
    location /api/ {
        proxy_pass http://cybermind-backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Proxy a endpoints directos del backend FastAPI
    location ~ ^/(health|status|workers|config|docs|documents|llm|code|hashed|newsSpider|start-spacy|postgre-ttrss|network)(/|$) {
        proxy_pass http://cybermind-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}
